plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'expo.modules.locuswifi'
version = '0.1.0'

android {
  namespace "expo.modules.locuswifi"
  defaultConfig {
    versionCode 1
    versionName "0.1.0"
  }
  lintOptions {
    abortOnError false
  }
}

dependencies {
  // ContextCompat.registerReceiver / RECEIVER_EXPORTED and LocationManagerCompat (same version as expo-modules-core).
  implementation "androidx.core:core-ktx:1.17.0"
}
