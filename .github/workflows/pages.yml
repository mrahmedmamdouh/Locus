name: Deploy dashboard and console to Pages

# One-time setup: repo Settings -> Pages -> Build and deployment -> Source: "GitHub Actions".
on:
  push:
    branches: [main]
    paths:
      - 'dashboard/**'
      - 'console/**'
      - 'packages/**'
      - 'package-lock.json'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read

# Only one deployment at a time; let an in-flight production deploy finish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build dashboard
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Node (version from .nvmrc)
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      # No configure-pages step: the dashboard is built with a relative base ('./'),
      # so it needs no Pages metadata at build time.
      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build -w dashboard

      # The bank console is served next to the dashboard at /console/. Set the repository
      # variable LOCUS_API_URL to prefill the API address on its sign-in page.
      - name: Build console
        env:
          VITE_LOCUS_API_URL: ${{ vars.LOCUS_API_URL }}
        run: |
          npm run build -w console
          cp -r console/dist dashboard/dist/console

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: dashboard/dist

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
