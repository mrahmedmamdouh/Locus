name: iOS SDK

on:
  push:
    branches: [main]
    paths: ['Package.swift', 'sdk/ios/**', 'sdk/spec/**', '.github/workflows/sdk-ios.yml']
  pull_request:
    paths: ['Package.swift', 'sdk/ios/**', 'sdk/spec/**', '.github/workflows/sdk-ios.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sdk-ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Swift tests (shared vectors) and iOS build
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Toolchain
        run: swift --version && xcodebuild -version

      - name: Unit tests (macOS host)
        run: swift test

      - name: Build the SDK for iOS (simulator)
        run: xcodebuild build -scheme LocusSDK -destination 'generic/platform=iOS Simulator' -quiet

      - name: Build the demo bank app (simulator)
        run: |
          brew install xcodegen
          cd sdk/ios/DemoBank
          xcodegen generate
          xcodebuild build -project DemoBank.xcodeproj -scheme DemoBank -destination 'generic/platform=iOS Simulator' CODE_SIGNING_ALLOWED=NO -quiet
