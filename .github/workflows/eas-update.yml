name: EAS Update (app)

# Optional, manual only. Publishes the field-test app JS bundle to Expo's free
# EAS Update tier so testers on a development build / Expo Go pick it up.
# Not part of CI; nothing else depends on it.
#
# One-time setup (see README "Publishing the app with EAS Update"):
#   1. Create a free account at https://expo.dev
#   2. In app/: `npx eas-cli@latest login` then `npx eas-cli@latest init`
#      (writes extra.eas.projectId into app/app.json; commit it)
#      and `npx eas-cli@latest update:configure`
#   3. Create an access token at https://expo.dev/settings/access-tokens and
#      add it as the repository secret EXPO_TOKEN.

on:
  workflow_dispatch:
    inputs:
      branch:
        description: EAS Update branch (channel) to publish to
        required: true
        default: preview
      message:
        description: Update message shown in the Expo dashboard
        required: false
        default: ''

permissions:
  contents: read

concurrency:
  group: eas-update-${{ inputs.branch }}
  cancel-in-progress: false

jobs:
  update:
    name: Publish update
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
    steps:
      - name: Check for EXPO_TOKEN
        id: token
        run: |
          if [ -z "$EXPO_TOKEN" ]; then
            echo "::notice title=EAS Update skipped::EXPO_TOKEN secret is not set. See the one-time setup notes at the top of .github/workflows/eas-update.yml."
            echo "present=false" >> "$GITHUB_OUTPUT"
          else
            echo "present=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Check out
        if: steps.token.outputs.present == 'true'
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Node (version from .nvmrc)
        if: steps.token.outputs.present == 'true'
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Set up EAS CLI
        if: steps.token.outputs.present == 'true'
        uses: expo/expo-github-action@v9
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install dependencies
        if: steps.token.outputs.present == 'true'
        run: npm ci

      - name: Publish update
        if: steps.token.outputs.present == 'true'
        working-directory: app
        env:
          UPDATE_BRANCH: ${{ inputs.branch }}
          UPDATE_MESSAGE: ${{ inputs.message || github.sha }}
        run: eas update --branch "$UPDATE_BRANCH" --message "$UPDATE_MESSAGE" --non-interactive
