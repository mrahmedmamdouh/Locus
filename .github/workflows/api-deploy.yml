name: Deploy API to Cloudflare

# Runs after the first setup (npm run setup:cloudflare -w api) once these exist:
#   - repository secrets CLOUDFLARE_API_TOKEN (template "Edit Cloudflare Workers" + D1 edit) and CLOUDFLARE_ACCOUNT_ID
#   - the D1 database id committed in api/wrangler.toml (the setup script writes it there)
# Without them the job explains what is missing and does nothing.

on:
  push:
    branches: [main]
    paths: ['api/**', 'packages/altitude-core/src/**', '.github/workflows/api-deploy.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: api-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      WRANGLER_SEND_METRICS: 'false'
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Ready to deploy?
        id: ready
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::notice::Skipped: add the CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID repository secrets to deploy from GitHub (see docs/api.md)."
            echo "ok=false" >> "$GITHUB_OUTPUT"
          elif grep -q 'REPLACE_WITH_DATABASE_ID' api/wrangler.toml; then
            echo "::notice::Skipped: run the setup script once and commit api/wrangler.toml with the D1 database id."
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-node@v7
        if: steps.ready.outputs.ok == 'true'
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install
        if: steps.ready.outputs.ok == 'true'
        run: npm ci

      - name: Test the API
        if: steps.ready.outputs.ok == 'true'
        run: npm test -w api

      - name: Apply database migrations
        if: steps.ready.outputs.ok == 'true'
        working-directory: api
        run: npx wrangler d1 migrations apply locus --remote

      - name: Deploy
        if: steps.ready.outputs.ok == 'true'
        working-directory: api
        run: npx wrangler deploy
