name: Deploy API to Cloudflare

# Puts the Locus API on Cloudflare (Workers + D1, free plan) and keeps it up to date.
# First time: add three repository secrets (Settings → Secrets and variables → Actions):
#   CLOUDFLARE_API_TOKEN   Cloudflare → My Profile → API Tokens → Create Token → "Edit Cloudflare Workers",
#                          then add the permission Account → D1 → Edit
#   CLOUDFLARE_ACCOUNT_ID  Cloudflare dashboard → Workers & Pages → Account ID (right-hand side)
#   LOCUS_PLATFORM_KEY     a long random password you choose (keep it in your password manager)
# then run this workflow (Actions → Deploy API to Cloudflare → Run workflow). It creates the
# workers.dev subdomain and the database if needed, applies migrations and deploys. After that it
# runs on every change to the API. See docs/api.md.

on:
  push:
    branches: [main]
    paths: ['api/**', 'packages/altitude-core/src/**', '.github/workflows/api-deploy.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: api-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      LOCUS_PLATFORM_KEY: ${{ secrets.LOCUS_PLATFORM_KEY }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Ready to deploy?
        id: ready
        run: |
          missing=""
          for s in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID LOCUS_PLATFORM_KEY; do
            [ -n "${!s}" ] || missing="$missing $s"
          done
          if [ -n "$missing" ]; then
            echo "::notice::Not deployed: add the repository secret(s)$missing (see the top of .github/workflows/api-deploy.yml)."
            echo "ok=false" >> "$GITHUB_OUTPUT"
          elif [ ${#LOCUS_PLATFORM_KEY} -lt 24 ]; then
            echo "::error::LOCUS_PLATFORM_KEY is too short: use at least 24 random characters."
            echo "ok=false" >> "$GITHUB_OUTPUT"
            exit 1
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-node@v7
        if: steps.ready.outputs.ok == 'true'
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install
        if: steps.ready.outputs.ok == 'true'
        run: npm ci

      - name: Test the API
        if: steps.ready.outputs.ok == 'true'
        run: npm test -w api

      - name: Set up and deploy
        if: steps.ready.outputs.ok == 'true'
        run: bash api/scripts/ci-deploy.sh
