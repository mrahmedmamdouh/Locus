version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    groups:
      npm-minor-and-patch:
        update-types: [minor, patch]
    ignore:
      # No automatic major upgrades for any npm package: Expo SDK 58 pins
      # compatible versions (TypeScript, AsyncStorage, Vite plugins...), so
      # majors are done deliberately with `npx expo install --fix`.
      - dependency-name: '*'
        update-types: [version-update:semver-major]
      - dependency-name: react-native
      - dependency-name: react
        update-types: [version-update:semver-major, version-update:semver-minor]
      - dependency-name: '@types/react'
        update-types: [version-update:semver-major, version-update:semver-minor]
    commit-message:
      prefix: deps

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      github-actions:
        patterns: ['*']
    commit-message:
      prefix: ci
